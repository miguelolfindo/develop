# Builds the installers when a version tag (v1.2.3) is pushed and publishes them as a GitHub
# release: a Windows x64 NSIS installer (.exe) and an Apple Silicon disk image (.dmg).
#
# The release is created as a hidden draft, both installers are uploaded to it, and only then
# is it published. Develop's update check therefore never sees a release whose installer for
# its system is still being built; if a build fails, the release stays a draft.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # The AI denoise model is not kept in the repository; it is fetched from darktable's
  # release and checked before packaging.
  MODEL_URL: https://github.com/darktable-org/darktable-ai/releases/download/release-5.6.0/rawdenoise-nind.dtmodel
  MODEL_SHA256: d71b5f1e727c85a359e6f74dca9e2016c9d8fc3e2f7ac3e9b347d80ceca969af
  # ONNX Runtime's prebuilt macOS library targets macOS 13.4; build for the same.
  MACOSX_DEPLOYMENT_TARGET: "13.4"

jobs:
  draft:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the previous release tag is needed for the documentation check
      # HARD RULE (RELEASING.md): every release updates all the documentation. No release is
      # made unless the release notes match this version and the user documentation changed
      # since the previous release.
      - name: Check the documentation is updated for this release
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          fail() { echo "::error::$1 Every release must update the documentation: see RELEASING.md."; exit 1; }
          [ "$(head -n 1 RELEASE_NOTES.md | tr -d '\r')" = "## Develop ${version}" ] || fail "RELEASE_NOTES.md must start with '## Develop ${version}'."
          grep -q "^version = \"${version}\"" Cargo.toml || fail "Cargo.toml's version is not ${version}."
          prev=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            changed=$(git diff --name-only "$prev" "$tag")
            for f in RELEASE_NOTES.md README.md docs/USER-GUIDE.md; do
              echo "$changed" | grep -qx "$f" || fail "$f was not updated since ${prev}."
            done
            if echo "$changed" | grep -qE '^src/(mcp|measure)\.rs$'; then
              for f in docs/MCP.md docs/develop-skill/SKILL.md; do
                echo "$changed" | grep -qx "$f" || fail "The MCP server changed since ${prev} but $f was not updated."
              done
            fi
            echo "Documentation updated since ${prev}:"
            echo "$changed" | grep -E '\.md$' || true
          fi
      - name: Create the release as a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --draft --verify-tag             --title "Develop ${{ github.ref_name }}" --notes-file RELEASE_NOTES.md

  package:
    needs: draft
    # Also runs when started by hand (no tag, so no draft release).
    if: ${{ always() && (needs.draft.result == 'success' || needs.draft.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            format: nsis
            artifact: dist/*.exe dist/*-update.zip dist/models.tsv
          - os: macos-latest
            target: aarch64-apple-darwin
            format: dmg
            artifact: dist/*.dmg dist/*-update.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: true
          # The action defaults to RUSTFLAGS="-D warnings", which turns warnings in the
          # vendored crates under patches/ into errors. A release build should not fail on
          # warnings, so clear it.
          rustflags: ""

      - name: Fetch the denoise model
        shell: bash
        run: |
          mkdir -p models
          curl -L --fail -o model.zip "$MODEL_URL"
          if command -v sha256sum >/dev/null; then
            echo "$MODEL_SHA256  model.zip" | sha256sum -c -
          else
            echo "$MODEL_SHA256  model.zip" | shasum -a 256 -c -
          fi
          unzip -o -j model.zip "rawdenoise-nind/model_bayer.onnx" "rawdenoise-nind/model_linear.onnx" -d models
          mv models/model_bayer.onnx models/rawnind_bayer.onnx
          mv models/model_linear.onnx models/rawnind_linear.onnx
          rm model.zip

      - name: Fetch the face recognition and CLIP models
        shell: bash
        run: |
          mkdir -p models
          fetch() {
            curl -L --fail -o "models/$2" "$1"
            if command -v sha256sum >/dev/null; then
              echo "$3  models/$2" | sha256sum -c -
            else
              echo "$3  models/$2" | shasum -a 256 -c -
            fi
          }
          fetch "https://github.com/opencv/opencv_zoo/raw/main/models/face_recognition_sface/face_recognition_sface_2021dec.onnx" face_recognition_sface_2021dec.onnx 0ba9fbfa01b5270c96627c4ef784da859931e02f04419c829e83484087c34e79
          fetch "https://huggingface.co/Xenova/clip-vit-base-patch32/resolve/main/onnx/vision_model_quantized.onnx" clip_vision_quantized.onnx 583fd1110a514667812fee7d684952aaf82a99b959760c8d7dca7e0ab9839299
          fetch "https://huggingface.co/Xenova/clip-vit-base-patch32/resolve/main/onnx/text_model_quantized.onnx" clip_text_quantized.onnx 73baab855d406190da9faa498cfedf65f15cf309f4cc7385b7b032e6d08e5c3a

      - name: Install cargo-packager
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager

      - name: Build and package
        run: cargo packager --release --formats ${{ matrix.format }}

      # The small update: everything but the AI models (which rarely change). Develop downloads
      # it instead of the full installer when it already has the models models.tsv lists.
      - name: Make the small update package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $stage = 'update-stage'
          New-Item -ItemType Directory -Force "$stage/models" | Out-Null
          Copy-Item target/release/develop.exe $stage
          Copy-Item target/release/*.dll $stage
          if (Test-Path lensfun) { Copy-Item lensfun $stage -Recurse }
          Copy-Item models/LICENSE-*.txt "$stage/models"
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/develop_${v}_x64-update.zip" -CompressionLevel Optimal
          Get-ChildItem models -File | Where-Object { $_.Extension -in '.onnx', '.json' } | Sort-Object Name | ForEach-Object { "$($_.Name)`t$($_.Length)" } | Out-File dist/models.tsv -Encoding ascii
          Get-ChildItem dist | Format-Table Name, Length

      - name: Make the small update package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          app=$(find dist target/release -maxdepth 4 -name '*.app' -type d 2>/dev/null | head -1)
          if [ -z "$app" ]; then echo "::warning::No .app found; Mac updates will use the full disk image."; exit 0; fi
          stage=$(mktemp -d)
          ditto "$app" "$stage/Develop.app"
          rm -f "$stage/Develop.app/Contents/Resources/models/"*.onnx
          (cd "$stage" && ditto -c -k --keepParent Develop.app "$GITHUB_WORKSPACE/dist/Develop_${v}_aarch64-update.zip")
          ls -l dist

      - name: Upload to the draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(${{ matrix.artifact }})
          gh release upload "${{ github.ref_name }}" "${files[@]}" --clobber

      - name: Keep the installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: develop-${{ matrix.target }}
          path: dist/*

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release (both installers are attached)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false --latest
